<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>splatity · 2D trainer</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #0d0f17; color: #e6e8ee; }
      body { font: 14px/1.4 system-ui, sans-serif; }
      main { max-width: 1100px; margin: 0 auto; padding: 16px; }
      h1 { margin: 0; font-size: 17px; }
      a { color: #8ab4ff; }
      .muted { color: #9aa3b5; }
      header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin-bottom: 12px; }
      .views { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      @media (max-width: 640px) { .views { grid-template-columns: 1fr; } }
      figure { margin: 0; }
      figcaption { margin-bottom: 4px; }
      canvas { display: block; width: 100%; height: auto; border-radius: 6px; background: #000; }
      #stats { margin: 12px 0 4px; font-variant-numeric: tabular-nums; }
      #curve { height: 90px; }
      .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; margin-top: 12px; }
      .controls label { display: flex; align-items: center; gap: 8px; }
      button, select, .button {
        font: inherit; color: inherit; background: #1b2030; cursor: pointer;
        padding: 4px 12px; border: 1px solid #4a5268; border-radius: 6px;
      }
      button:hover, .button:hover { background: #262b3a; }
      input[type='range'] { width: 150px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>splatity · 2D trainer</h1>
        <span class="muted">Fitting gaussians to a picture by gradient descent</span>
        <a href="./index.html">3D viewer →</a>
      </header>
      <div class="views">
        <figure>
          <figcaption class="muted">Target picture</figcaption>
          <canvas id="target"></canvas>
        </figure>
        <figure>
          <figcaption class="muted">Rendered from the gaussians</figcaption>
          <canvas id="fit"></canvas>
        </figure>
      </div>
      <div id="stats">&nbsp;</div>
      <canvas id="curve" title="Closeness to the target (PSNR) over the iterations so far"></canvas>
      <div class="controls">
        <button id="pause">Pause</button>
        <button id="restart">Restart</button>
        <label>
          Gaussians, at most
          <select id="max">
            <option>300</option>
            <option selected>1500</option>
            <option>4000</option>
          </select>
        </label>
        <label>
          Splat size
          <input id="size" type="range" min="0.1" max="1.5" step="0.01" value="1" />
        </label>
        <label>
          <input id="file" type="file" accept="image/*" hidden />
          <span class="button">Open a picture…</span>
          <span class="muted">or drop one anywhere</span>
        </label>
      </div>
    </main>
    <script type="module" src="/src/trainer.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>splatity</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0d0f17; color: #e6e8ee; }
      body { font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
      #view {
        display: block; width: 100vw; height: 100vh; height: 100dvh;
        touch-action: none; cursor: grab;
      }
      #view:active { cursor: grabbing; }
      #hud {
        position: fixed; left: 12px; top: 12px; right: 12px; max-width: 340px;
        padding: 10px 12px; border-radius: 8px;
        background: rgba(13, 15, 23, 0.72); backdrop-filter: blur(6px);
      }
      #hud h1 { margin: 0 0 2px; font-size: 15px; }
      #stats { color: #9aa3b5; font-variant-numeric: tabular-nums; }
      #hud label { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
      #hud input { flex: 1; min-width: 0; }
      #hint { margin-top: 6px; color: #9aa3b5; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="hud">
      <h1>splatity</h1>
      <div id="stats">&nbsp;</div>
      <label>
        Splat size
        <input id="size" type="range" min="0.02" max="1.5" step="0.01" value="1" />
      </label>
      <div id="hint">Drag to orbit · scroll or pinch to zoom · shrink the splats to see the points</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
